name: Bug report
description: Report a reproducible CLI or packaging problem
body:
  - type: markdown
    attributes:
      value: Do not attach private recordings, transcripts, prompts, tokens or personal paths.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version, OS, Python or Docker image, model, CPU/RAM, GPU/driver when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal anonymized command, expected result, actual result and exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Relevant stderr and doctor output; redact paths and secrets first.
      render: text
