name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_benchmark:
        description: Compare MSVC and ClangCL with small on one Windows VM (41-second public fixture)
        type: boolean
        default: false
      verify_ccache:
        description: Verify clean rebuild cache hits (extra build for each compiler)
        type: boolean
        default: false
      run_portable_inference:
        description: Run slow baseline-CPU inference (x86_64 without AVX2, ARMv8.0) under QEMU before release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Explicit names keep the existing required-check names stable.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (gcc, g++, OFF)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            sanitize: 'OFF'
            lint: true
          - name: test (clang-18, clang++-18, ON)
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            sanitize: 'ON'
            lint: false
          - name: test (gcc, g++, OFF, aarch64)
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            sanitize: 'OFF'
            lint: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build clang-18 clang-format-18 libomp-18-dev ffmpeg libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev jq shellcheck strace exfatprogs exfat-fuse
      - id: compiler
        run: echo "version=$(${{ matrix.cxx }} -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cc }}-${{ steps.compiler.outputs.version }}-${{ matrix.sanitize }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cc }}-${{ steps.compiler.outputs.version }}-${{ matrix.sanitize }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-
      - run: |
          printf '%s\n' "CCACHE_DIR=$PWD/.build/ccache" "CCACHE_BASEDIR=$PWD" \
            'CCACHE_MAXSIZE=500M' >> "$GITHUB_ENV"
      - if: matrix.lint
        run: find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -exec clang-format-18 --dry-run --Werror {} +
      - if: matrix.lint
        run: find tests packaging -type f -name '*.sh' -exec shellcheck {} +
      - if: matrix.lint
        run: |
          bash tests/packaging/release.sh
          bash tests/packaging/release-preflight.sh
          bash tests/packaging/cuda-release.sh
          bash tests/packaging/runtime-policy.sh
          cmake "-DWT_TEST_DIR=.build/source-contracts" -P tests/packaging/sources.cmake
      - run: cmake -S . -B .build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON -DWT_SANITIZERS=${{ matrix.sanitize }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - run: cmake --build .build/ci -j2
      - run: ccache --show-stats
      - name: Verify clean rebuild cache hits (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_ccache
        run: |
          ccache --zero-stats
          cmake --build .build/ci --target clean
          cmake --build .build/ci -j2
          ccache --show-stats
          ccache --print-stats | awk '$1 ~ /cache_hit/ { hits += $2 } END { exit !(hits > 0) }'
      - run: ctest --test-dir .build/ci --output-on-failure
      - run: bash tests/smoke/prepare-smoke.sh .build/ci/whisper-transcribator .build/fixtures
      - name: Reject silent CPU fallback on GPU initialization failure (tiny, no GPU required)
        run: .build/ci/tests/wt-gpu-init-smoke .build/fixtures/ggml-tiny.bin
      - name: Check checkpoints, publication and model cache on exFAT (exfat-fuse)
        run: bash tests/integration/platform/exfat.sh .build/ci .build/fixtures .build/exfat
      - if: matrix.sanitize == 'OFF'
        run: bash tests/smoke/model-hash.sh .build/ci/whisper-transcribator .build/fixtures .build/model-hash
      - run: |
          sudo unshare --net bash tests/smoke/smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
          sudo unshare --net bash tests/smoke/streaming-smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/ci/tests/wt-audio-fixture" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-streaming"
  windows:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            toolchain: x64
            arch: x86_64
          - os: windows-11-arm
            toolchain: arm64
            arch: arm64
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.build/vcpkg-cache
      CCACHE_DIR: ${{ github.workspace }}/.build/windows-ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: windows-tools
        uses: ./.github/actions/windows-tools
        with:
          architecture: ${{ matrix.toolchain }}
      - id: ffmpeg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/windows-ffmpeg
          key: ffmpeg-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-${{ hashFiles('packaging/ffmpeg.sh', 'packaging/windows-ffmpeg.sh') }}
      - id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/vcpkg-cache
          key: vcpkg-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-${{ steps.windows-tools.outputs.clang }}-${{ hashFiles('vcpkg.json', 'packaging/triplets/*.cmake', 'packaging/windows-arm64-clang.cmake') }}
          restore-keys: |
            vcpkg-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-${{ steps.windows-tools.outputs.clang }}-
            vcpkg-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-
      - id: windows-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/windows-ccache
          key: ccache-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-${{ steps.windows-tools.outputs.clang }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt', 'vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.toolchain }}-${{ steps.windows-tools.outputs.compiler }}-${{ steps.windows-tools.outputs.clang }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt', 'vcpkg.json') }}-
      - name: Build pinned decoding-only FFmpeg with MSVC
        shell: msys2 {0}
        run: bash packaging/windows-ffmpeg.sh '${{ matrix.toolchain }}'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: .build/windows-ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Configure dependencies and application (ClangCL on ARM64)
        shell: pwsh
        run: ./packaging/windows-build.ps1 -Architecture '${{ matrix.toolchain }}' -Stage Configure -PkgConfig '${{ steps.windows-tools.outputs.pkgconfig }}'
      - id: windows-build
        name: Compile application and test executables
        shell: pwsh
        run: ./packaging/windows-build.ps1 -Architecture '${{ matrix.toolchain }}' -Stage Build
      - name: Run native model-free CTest
        shell: pwsh
        run: ./packaging/windows-build.ps1 -Architecture '${{ matrix.toolchain }}' -Stage Test
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.windows-ccache.outputs.cache-hit != 'true'
        with:
          path: .build/windows-ccache
          key: ${{ steps.windows-ccache.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: .build/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.windows-build.conclusion == 'success'
        with:
          name: windows-test-binaries-${{ matrix.arch }}
          path: .build/windows/bin
          retention-days: 7
          if-no-files-found: error
      - name: Verify file safety and startup as a standard Windows user
        shell: pwsh
        run: ./tests/integration/platform/windows-user.ps1 -Bin .build/windows/bin
      - name: Package tested binaries, sources and notices (no inference)
        shell: pwsh
        run: ./packaging/windows-bundle.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-windows-${{ matrix.arch }}
          path: .build/artifacts/windows-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
      - name: Build experimental ClangCL on the same VM (manual benchmark only)
        if: matrix.toolchain == 'x64' && github.event_name == 'workflow_dispatch' && inputs.run_windows_benchmark
        shell: pwsh
        run: ./packaging/windows-build.ps1 -Compiler clangcl -Build .build/windows-clangcl -PkgConfig '${{ steps.windows-tools.outputs.pkgconfig }}'
      - name: Compare warmed MSVC and ClangCL runs (manual benchmark only)
        if: matrix.toolchain == 'x64' && github.event_name == 'workflow_dispatch' && inputs.run_windows_benchmark
        shell: pwsh
        run: ./tests/benchmarks/windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() && matrix.toolchain == 'x64' && github.event_name == 'workflow_dispatch' && inputs.run_windows_benchmark
        with:
          name: windows-clangcl-diagnostics
          path: |
            .build/windows-clangcl/CMakeCache.txt
            .build/windows-clangcl/Testing/Temporary/LastTest.log
            .build/windows-clangcl/bin/*.exe
            .build/windows-clangcl/bin/*.dll
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.toolchain == 'x64' && github.event_name == 'workflow_dispatch' && inputs.run_windows_benchmark
        with:
          name: windows-compiler-comparison
          path: .build/windows-benchmark/results
          retention-days: 7
          if-no-files-found: warn
  package-windows:
    name: package (windows-${{ matrix.arch }})
    needs: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            toolchain: x64
            arch: x86_64
          - os: windows-11-arm
            toolchain: arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.toolchain }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-windows-${{ matrix.arch }}
          path: .build/artifacts/windows-${{ matrix.arch }}
      - name: Verify exact ZIP with restricted runtime PATH (no models or inference)
        shell: pwsh
        run: |
          # PowerShell needs the complete -D argument quoted when its value starts with a dot.
          cmake "-DWT_TEST_DIR=.build/source-contracts" -P tests/packaging/sources.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Source archive contracts failed' }
          ./tests/packaging/windows-policy.ps1
          ./tests/packaging/windows.ps1 -Architecture '${{ matrix.arch }}' -Artifacts .build/artifacts/windows-${{ matrix.arch }}
          ./tests/packaging/windows.ps1 -Architecture '${{ matrix.arch }}' -Artifacts .build/artifacts/windows-${{ matrix.arch }}
  smoke-windows:
    name: smoke (windows-${{ matrix.arch }})
    needs: package-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-test-binaries-${{ matrix.arch }}
          path: .build/windows/bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-windows-${{ matrix.arch }}
          path: .build/artifacts/windows-${{ matrix.arch }}
      - name: Extract exact ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem .build/artifacts/windows-${{ matrix.arch }} -Filter '*.zip'
          Expand-Archive $archive.FullName .build/archive
      - name: Prepare public 11-second fixture and tiny weights
        shell: bash
        run: bash tests/smoke/prepare-smoke.sh .build/archive/bin/whisper-transcribator.exe .build/fixtures --mp3
      - name: Block application network access during inference
        shell: pwsh
        run: |
          $exe = (Resolve-Path .build/archive/bin/whisper-transcribator.exe).Path
          New-NetFirewallRule -DisplayName 'Whisper offline test' -Direction Outbound -Program $exe -Action Block
      - name: Check CPU inference, interruption and resume
        shell: bash
        run: |
          export WT_PROCESS_RUNNER="$PWD/.build/windows/bin/wt-process-runner.exe"
          binary="$PWD/.build/archive/bin/whisper-transcribator.exe"
          "$binary" doctor --device cpu --json
          bash tests/smoke/smoke.sh "$binary" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
          bash tests/smoke/streaming-smoke.sh "$binary" "$PWD/.build/windows/bin/wt-audio-fixture.exe" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline-streaming"
      - name: Check WAV and MP3 decoding with Unicode paths offline
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          ./tests/smoke/windows-paths.ps1 -Binary .build/archive/bin/whisper-transcribator.exe -Fixtures .build/fixtures -Output .build/windows-paths
      - name: Remove test firewall rule
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName 'Whisper offline test' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
  windows-servercore:
    name: package (windows-servercore)
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-windows-x86_64
          path: .build/artifacts/windows-x86_64
      - name: Verify ZIP without installed VC++ runtime (no models or inference)
        shell: pwsh
        run: |
          Start-Service docker
          ./tests/packaging/windows-servercore.ps1 -Artifacts .build/artifacts/windows-x86_64
  macos:
    name: test (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Homebrew dependencies
        run: |
          # ffmpeg-full only generates test fixtures; the build links Homebrew's ffmpeg.
          brew install ccache ninja pkgconf ffmpeg ffmpeg-full openssl@3 jq
          ffmpeg -hide_banner -version | head -n 1
          fixtures=$(brew --prefix ffmpeg-full)/bin/ffmpeg
          "$fixtures" -hide_banner -encoders | grep -w libvorbis
          "$fixtures" -hide_banner -encoders | grep -w libmp3lame
          bash --version | head -n 1
      - id: compiler
        run: echo "version=$(clang++ -dumpversion)-$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-
      - run: |
          printf '%s\n' "CCACHE_DIR=$PWD/.build/ccache" "CCACHE_BASEDIR=$PWD" \
            'CCACHE_MAXSIZE=500M' >> "$GITHUB_ENV"
      - run: cmake -S . -B .build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build .build/ci -j3
      - run: ccache --show-stats
      - run: ctest --test-dir .build/ci --output-on-failure
      - name: Report devices (hosted runners may not expose Metal)
        id: devices
        run: |
          .build/ci/whisper-transcribator doctor --json | tee .build/doctor.json
          echo "device=$(jq -r .device .build/doctor.json)" >> "$GITHUB_OUTPUT"
      - run: bash tests/smoke/prepare-smoke.sh .build/ci/whisper-transcribator .build/fixtures
      - name: Check checkpoints, publication and model cache on exFAT (hdiutil)
        run: bash tests/integration/platform/exfat.sh .build/ci .build/fixtures .build/exfat
      - name: Run CPU inference without network access
        run: |
          deny='(version 1)(allow default)(deny network*)'
          sandbox-exec -p "$deny" bash tests/smoke/smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
          sandbox-exec -p "$deny" bash tests/smoke/streaming-smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/ci/tests/wt-audio-fixture" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-streaming"
      - name: Run Metal inference without network access
        if: steps.devices.outputs.device == 'metal'
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tests/smoke/smoke.sh \
            "$PWD/.build/ci/whisper-transcribator" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-metal" metal
  package:
    # The x86_64 leg keeps the existing required-check name.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: package
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: package (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build CPU archive (no model downloads or inference)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/Dockerfile
          target: archive
          outputs: type=local,dest=.build/artifacts/${{ matrix.directory }}
          build-args: |
            WT_SOURCE_REVISION=${{ github.sha }}
            WT_SOURCE_DIRTY=false
          cache-from: type=gha,version=2,scope=archive-${{ matrix.directory }}
          cache-to: type=gha,version=2,scope=archive-${{ matrix.directory }},mode=max,ignore-error=true,timeout=2m
      - name: Verify archive, dependencies and doctor
        run: bash tests/packaging/package.sh .build/artifacts/${{ matrix.directory }}
      - name: Install QEMU for the loader check
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Check baseline CPU backend loading (no inference, 30s limit)
        run: bash tests/packaging/portable.sh .build/artifacts/${{ matrix.directory }}/unpacked .build/portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: |
            .build/artifacts/${{ matrix.directory }}/*.tar.gz
            .build/artifacts/${{ matrix.directory }}/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  smoke:
    name: ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: smoke (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    env:
      ARCHIVE: .build/artifacts/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
      - name: Verify the exact archive produced by package
        run: bash tests/packaging/package.sh "$ARCHIVE"
      - name: Prepare public 11-second fixture and tiny weights
        run: bash tests/smoke/prepare-smoke.sh "$ARCHIVE/unpacked/bin/whisper-transcribator" .build/fixtures
      - name: Run archive inference offline in clean Ubuntu
        run: |
          mkdir -p .build/clean-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/$ARCHIVE/unpacked:/app:ro" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/clean-output:/output" \
            ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02 /app/bin/whisper-transcribator /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.text | ascii_downcase | contains("country"))' .build/clean-output/jfk.json
      - name: Wrap the same archive in Docker (no recompilation)
        run: docker build -f packaging/Dockerfile --target runtime-bundle -t whisper-transcribator:test "$ARCHIVE/unpacked"
      - name: Check offline inference as the default non-root user
        run: |
          # Only public test fixtures are shared with the image's different default UID.
          chmod a+r .build/fixtures/jfk.wav .build/fixtures/ggml-tiny.bin
          test "$(docker run --rm --entrypoint id whisper-transcribator:test -u)" = 10001
          docker run --rm --network none --entrypoint /bin/bash \
            -v "$PWD/.build/fixtures:/fixtures:ro" whisper-transcribator:test -euc '
              /opt/whisper-transcribator/bin/whisper-transcribator /fixtures/jfk.wav \
                --model /fixtures/ggml-tiny.bin --no-vad --language en --device cpu \
                --local-files-only --output-dir /data/transcripts
              test -s /data/transcripts/jfk.txt
              test "$(stat -c %u /data/transcripts/.whisper-transcribator)" = 10001
              test -w /models
            '
      - name: Check offline inference with host-owned outputs
        run: |
          mkdir -p .build/docker-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/docker-output:/output" \
            whisper-transcribator:test /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.segments | length > 0)' .build/docker-output/jfk.json
  package-macos:
    name: package (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build and test tools (the archive bundles none of them)
        run: brew install ninja pkgconf ffmpeg-full openssl@3 jq
      - name: Verify common source archive contracts (no models)
        run: cmake "-DWT_TEST_DIR=.build/source-contracts" -P tests/packaging/sources.cmake
      - name: Build FFmpeg and the archive, test its binaries and package them
        env:
          WT_SOURCE_REVISION: ${{ github.sha }}
          WT_SOURCE_DIRTY: 'false'
        run: bash packaging/macos.sh .build/artifacts/macos-arm64
      - name: Verify archive, dependencies, signatures and doctor
        run: bash tests/packaging/package.sh .build/artifacts/macos-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-macos-arm64
          path: |
            .build/artifacts/macos-arm64/*.tar.gz
            .build/artifacts/macos-arm64/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  smoke-macos:
    name: ${{ matrix.name }}
    needs: package-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke (macos-arm64)
            os: macos-15
          # The oldest macOS the archive supports.
          - name: smoke (macos-arm64, macOS 14)
            os: macos-14
    env:
      ARCHIVE: .build/artifacts/macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-macos-arm64
          path: ${{ env.ARCHIVE }}
      - name: Verify the exact archive produced by package
        run: |
          command -v jq >/dev/null || brew install jq
          # The README checks one archive against the release's combined checksums.
          { cat "$ARCHIVE/SHA256SUMS"; printf '%064d  whisper-transcribator-linux.tar.gz\n' 0; } >.build/combined
          (cd "$ARCHIVE" && shasum -a 256 --check --ignore-missing ../../combined)
          bash tests/packaging/package.sh "$ARCHIVE"
      - name: Load only archive and macOS libraries, including Metal
        run: |
          DYLD_PRINT_LIBRARIES=1 "$ARCHIVE/unpacked/bin/whisper-transcribator" doctor --device metal --json \
            >.build/doctor.json 2>.build/dyld.log
          jq -e '.device == "metal" and .errors == []' .build/doctor.json
          grep -q "unpacked/lib/libggml-metal.so" .build/dyld.log
          if grep -E '/opt/homebrew|/usr/local' .build/dyld.log; then exit 1; fi
      - name: Prepare public 11-second fixture and tiny weights
        run: bash tests/smoke/prepare-smoke.sh "$ARCHIVE/unpacked/bin/whisper-transcribator" .build/fixtures
      - name: Run archive inference on CPU and Metal without network access
        run: |
          for device in cpu metal; do
            sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tests/smoke/smoke.sh \
              "$PWD/$ARCHIVE/unpacked/bin/whisper-transcribator" "$PWD/.build/fixtures/jfk.wav" \
              "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
              "$PWD/.build/smoke-$device" "$device"
          done
      - name: Check a browser-quarantined download (Gatekeeper without a Developer ID)
        run: |
          cp "$ARCHIVE"/*.tar.gz "$RUNNER_TEMP/download.tar.gz"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/download.tar.gz"
          mkdir "$RUNNER_TEMP/quarantined"
          tar -xzf "$RUNNER_TEMP/download.tar.gz" -C "$RUNNER_TEMP/quarantined"
          binary="$RUNNER_TEMP/quarantined/bin/whisper-transcribator"
          echo "Quarantine after tar extraction: $(xattr -p com.apple.quarantine "$binary" 2>/dev/null || echo none)"
          # Hosted runners may disable Gatekeeper; then the quarantined run succeeds.
          echo "Gatekeeper: $(spctl --status 2>&1 || true)"
          status=0
          perl -e 'alarm 60; exec @ARGV' "$binary" --version || status=$?
          echo "Quarantined run exit status: $status (informational)"
          # The README step for browser downloads must always work.
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/quarantined"
          "$binary" --version
  portable-inference:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_portable_inference
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portable-inference
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: portable-inference (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    env:
      ARCHIVE: .build/artifacts/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
      - name: Verify the exact archive produced by package
        run: bash tests/packaging/package.sh "$ARCHIVE"
      - name: Install QEMU for opt-in inference
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Prepare public 11-second fixture and tiny weights
        run: bash tests/smoke/prepare-smoke.sh "$ARCHIVE/unpacked/bin/whisper-transcribator" .build/fixtures
      - name: Run opt-in baseline-CPU inference (slow emulation, 10m limit)
        run: bash tests/packaging/portable.sh "$ARCHIVE/unpacked" .build/portable .build/fixtures
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          docker run --rm -v "$PWD:/src:ro" -w /build \
            debian:12-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates cmake ninja-build g++ git pkg-config \
                ffmpeg jq libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev
              pkg-config --modversion libavformat | grep "^59\.27\."
              cmake -S /src -B /build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON
              cmake --build /build -j2
              ctest --test-dir /build --output-on-failure
            '
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all
