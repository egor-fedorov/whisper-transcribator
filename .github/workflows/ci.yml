name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_ccache:
        description: Verify clean rebuild cache hits (extra build for each compiler)
        type: boolean
        default: false
      build_cuda:
        description: Build CUDA archive (hardware inference is a separate manual gate)
        type: boolean
        default: false
      run_portable_inference:
        description: Run slow baseline-CPU inference (x86_64 without AVX2, ARMv8.0) under QEMU before release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Explicit names keep the existing required-check names stable.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (gcc, g++, OFF)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            sanitize: 'OFF'
            lint: true
          - name: test (clang-18, clang++-18, ON)
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            sanitize: 'ON'
            lint: false
          - name: test (gcc, g++, OFF, aarch64)
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            sanitize: 'OFF'
            lint: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build clang-18 clang-format-18 libomp-18-dev ffmpeg libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev jq shellcheck strace exfatprogs exfat-fuse
      - id: compiler
        run: echo "version=$(${{ matrix.cxx }} -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cc }}-${{ steps.compiler.outputs.version }}-${{ matrix.sanitize }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cc }}-${{ steps.compiler.outputs.version }}-${{ matrix.sanitize }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-
      - run: |
          printf '%s\n' "CCACHE_DIR=$PWD/.build/ccache" "CCACHE_BASEDIR=$PWD" \
            'CCACHE_MAXSIZE=500M' >> "$GITHUB_ENV"
      - if: matrix.lint
        run: find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -exec clang-format-18 --dry-run --Werror {} +
      - if: matrix.lint
        run: find tests packaging -type f -name '*.sh' -exec shellcheck {} +
      - if: matrix.lint
        run: bash tests/packaging/release.sh
      - run: cmake -S . -B .build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON -DWT_SANITIZERS=${{ matrix.sanitize }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - run: cmake --build .build/ci -j2
      - run: ccache --show-stats
      - name: Verify clean rebuild cache hits (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_ccache
        run: |
          ccache --zero-stats
          cmake --build .build/ci --target clean
          cmake --build .build/ci -j2
          ccache --show-stats
          ccache --print-stats | awk '$1 ~ /cache_hit/ { hits += $2 } END { exit !(hits > 0) }'
      - run: ctest --test-dir .build/ci --output-on-failure
      - run: bash tests/smoke/prepare-smoke.sh .build/ci/whisper-transcribator .build/fixtures
      - name: Check checkpoints, publication and model cache on exFAT (exfat-fuse)
        run: bash tests/integration/exfat.sh .build/ci .build/fixtures .build/exfat
      - if: matrix.sanitize == 'OFF'
        run: bash tests/smoke/model-hash.sh .build/ci/whisper-transcribator .build/fixtures .build/model-hash
      - run: |
          sudo unshare --net bash tests/smoke/smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
          sudo unshare --net bash tests/smoke/streaming-smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/ci/tests/wt-audio-fixture" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-streaming"
  macos:
    name: test (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Homebrew dependencies
        run: |
          # ffmpeg-full only generates test fixtures; the build links Homebrew's ffmpeg.
          brew install ccache ninja pkgconf ffmpeg ffmpeg-full openssl@3 jq
          ffmpeg -hide_banner -version | head -n 1
          fixtures=$(brew --prefix ffmpeg-full)/bin/ffmpeg
          "$fixtures" -hide_banner -encoders | grep -w libvorbis
          "$fixtures" -hide_banner -encoders | grep -w libmp3lame
          bash --version | head -n 1
      - id: compiler
        run: echo "version=$(clang++ -dumpversion)-$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}-
      - run: |
          printf '%s\n' "CCACHE_DIR=$PWD/.build/ccache" "CCACHE_BASEDIR=$PWD" \
            'CCACHE_MAXSIZE=500M' >> "$GITHUB_ENV"
      - run: cmake -S . -B .build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build .build/ci -j3
      - run: ccache --show-stats
      - run: ctest --test-dir .build/ci --output-on-failure
      - name: Report devices (hosted runners may not expose Metal)
        id: devices
        run: |
          .build/ci/whisper-transcribator doctor --json | tee .build/doctor.json
          echo "device=$(jq -r .device .build/doctor.json)" >> "$GITHUB_OUTPUT"
      - run: bash tests/smoke/prepare-smoke.sh .build/ci/whisper-transcribator .build/fixtures
      - name: Check checkpoints, publication and model cache on exFAT (hdiutil)
        run: bash tests/integration/exfat.sh .build/ci .build/fixtures .build/exfat
      - name: Run CPU inference without network access
        run: |
          deny='(version 1)(allow default)(deny network*)'
          sandbox-exec -p "$deny" bash tests/smoke/smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
          sandbox-exec -p "$deny" bash tests/smoke/streaming-smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/ci/tests/wt-audio-fixture" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-streaming"
      - name: Run Metal inference without network access
        if: steps.devices.outputs.device == 'metal'
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tests/smoke/smoke.sh \
            "$PWD/.build/ci/whisper-transcribator" "$PWD/.build/fixtures/jfk.wav" \
            "$PWD/.build/fixtures/ggml-tiny.bin" "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" \
            "$PWD/.build/offline-metal" metal
  package:
    # The x86_64 leg keeps the existing required-check name.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: package
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: package (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build CPU archive (no model downloads or inference)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/Dockerfile
          target: archive
          outputs: type=local,dest=.build/artifacts/${{ matrix.directory }}
          build-args: |
            WT_SOURCE_REVISION=${{ github.sha }}
            WT_SOURCE_DIRTY=false
          cache-from: type=gha,version=2,scope=archive-${{ matrix.directory }}
          cache-to: type=gha,version=2,scope=archive-${{ matrix.directory }},mode=max,ignore-error=true,timeout=2m
      - name: Verify archive, dependencies and doctor
        run: bash tests/packaging/package.sh .build/artifacts/${{ matrix.directory }}
      - name: Install QEMU for the loader check
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Check baseline CPU backend loading (no inference, 30s limit)
        run: bash tests/packaging/portable.sh .build/artifacts/${{ matrix.directory }}/unpacked .build/portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: |
            .build/artifacts/${{ matrix.directory }}/*.tar.gz
            .build/artifacts/${{ matrix.directory }}/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  smoke:
    name: ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: smoke (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    env:
      ARCHIVE: .build/artifacts/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
      - name: Verify the exact archive produced by package
        run: bash tests/packaging/package.sh "$ARCHIVE"
      - name: Prepare public 11-second fixture and tiny weights
        run: bash tests/smoke/prepare-smoke.sh "$ARCHIVE/unpacked/bin/whisper-transcribator" .build/fixtures
      - name: Run archive inference offline in clean Ubuntu
        run: |
          mkdir -p .build/clean-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/$ARCHIVE/unpacked:/app:ro" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/clean-output:/output" \
            ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02 /app/bin/whisper-transcribator /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.text | ascii_downcase | contains("country"))' .build/clean-output/jfk.json
      - name: Wrap the same archive in Docker (no recompilation)
        run: docker build -f packaging/Dockerfile --target runtime-bundle -t whisper-transcribator:test "$ARCHIVE/unpacked"
      - name: Check offline inference as the default non-root user
        run: |
          # Only public test fixtures are shared with the image's different default UID.
          chmod a+r .build/fixtures/jfk.wav .build/fixtures/ggml-tiny.bin
          test "$(docker run --rm --entrypoint id whisper-transcribator:test -u)" = 10001
          docker run --rm --network none --entrypoint /bin/bash \
            -v "$PWD/.build/fixtures:/fixtures:ro" whisper-transcribator:test -euc '
              /opt/whisper-transcribator/bin/whisper-transcribator /fixtures/jfk.wav \
                --model /fixtures/ggml-tiny.bin --no-vad --language en --device cpu \
                --local-files-only --output-dir /data/transcripts
              test -s /data/transcripts/jfk.txt
              test "$(stat -c %u /data/transcripts/.whisper-transcribator)" = 10001
              test -w /models
            '
      - name: Check offline inference with host-owned outputs
        run: |
          mkdir -p .build/docker-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/docker-output:/output" \
            whisper-transcribator:test /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.segments | length > 0)' .build/docker-output/jfk.json
  portable-inference:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_portable_inference
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portable-inference
            os: ubuntu-24.04
            directory: cpu
            artifact: native-cpu
          - name: portable-inference (aarch64)
            os: ubuntu-24.04-arm
            directory: cpu-aarch64
            artifact: native-cpu-aarch64
    env:
      ARCHIVE: .build/artifacts/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
      - name: Verify the exact archive produced by package
        run: bash tests/packaging/package.sh "$ARCHIVE"
      - name: Install QEMU for opt-in inference
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Prepare public 11-second fixture and tiny weights
        run: bash tests/smoke/prepare-smoke.sh "$ARCHIVE/unpacked/bin/whisper-transcribator" .build/fixtures
      - name: Run opt-in baseline-CPU inference (slow emulation, 10m limit)
        run: bash tests/packaging/portable.sh "$ARCHIVE/unpacked" .build/portable .build/fixtures
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          docker run --rm -v "$PWD:/src:ro" -w /build \
            debian:12-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates cmake ninja-build g++ git pkg-config \
                ffmpeg jq libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev
              pkg-config --modversion libavformat | grep "^59\.27\."
              cmake -S /src -B /build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_WERROR=ON
              cmake --build /build -j2
              ctest --test-dir /build --output-on-failure
            '
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.build_cuda
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/Dockerfile
          target: archive
          outputs: type=local,dest=.build/artifacts/cuda
          build-args: |
            WT_CUDA=ON
            BUILD_IMAGE=nvidia/cuda:12.8.1-devel-ubuntu22.04@sha256:a99a1860ba8e2916e5c3e73b72ec4c4301653a84586e05bfc9a2aa2d58027e97
            WT_SOURCE_REVISION=${{ github.sha }}
            WT_SOURCE_DIRTY=false
          cache-from: type=gha,version=2,scope=archive-cuda
          cache-to: type=gha,version=2,scope=archive-cuda,mode=max,ignore-error=true,timeout=2m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-cuda-unverified-hardware
          path: .build/artifacts/cuda/*
          retention-days: 7
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all
