name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_cuda:
        description: Build CUDA archive (hardware inference is a separate manual gate)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
            sanitize: 'OFF'
          - cc: clang-18
            cxx: clang++-18
            sanitize: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-format-18 libomp-18-dev libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev jq shellcheck
      - run: clang-format-18 --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp
      - run: shellcheck tests/*.sh packaging/*.sh
      - run: cmake -S . -B .build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWT_SANITIZERS=${{ matrix.sanitize }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - run: cmake --build .build/ci -j2
      - run: ctest --test-dir .build/ci --output-on-failure
      - run: bash tests/prepare-smoke.sh .build/ci/whisper-transcribator .build/fixtures
      - run: |
          sudo unshare --net bash tests/smoke.sh "$PWD/.build/ci/whisper-transcribator" \
            "$PWD/.build/fixtures/jfk.wav" "$PWD/.build/fixtures/ggml-tiny.bin" \
            "$PWD/.build/fixtures/ggml-silero-v6.2.0.bin" "$PWD/.build/offline"
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -f packaging/Dockerfile --target archive --output type=local,dest=.build/artifacts/cpu .
      - run: |
          cd .build/artifacts/cpu
          sha256sum -c SHA256SUMS
          mkdir unpacked
          tar -xzf whisper-transcribator-0.3.0-linux-x86_64-cpu.tar.gz -C unpacked
      - run: bash tests/prepare-smoke.sh .build/artifacts/cpu/unpacked/bin/whisper-transcribator .build/fixtures
      - run: |
          mkdir -p .build/clean-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/.build/artifacts/cpu/unpacked:/app:ro" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/clean-output:/output" \
            ubuntu:22.04 /app/bin/whisper-transcribator /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.text | ascii_downcase | contains("country"))' .build/clean-output/jfk.json
      - run: docker build -f packaging/Dockerfile --target runtime -t whisper-transcribator:test .
      - run: |
          mkdir -p .build/docker-output
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/.build/fixtures:/fixtures:ro" -v "$PWD/.build/docker-output:/output" \
            whisper-transcribator:test /fixtures/jfk.wav \
            --model /fixtures/ggml-tiny.bin --vad-model /fixtures/ggml-silero-v6.2.0.bin \
            --language en --device cpu --local-files-only --output-dir /output --format all
          jq -e '.run.backend == "whisper.cpp" and (.segments | length > 0)' .build/docker-output/jfk.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cpu
          path: |
            .build/artifacts/cpu/*.tar.gz
            .build/artifacts/cpu/SHA256SUMS
          retention-days: 7
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.build_cuda
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          docker build -f packaging/Dockerfile --target archive --build-arg WT_CUDA=ON \
            --build-arg BUILD_IMAGE=nvidia/cuda:12.8.1-devel-ubuntu22.04@sha256:a99a1860ba8e2916e5c3e73b72ec4c4301653a84586e05bfc9a2aa2d58027e97 \
            --output type=local,dest=.build/artifacts/cuda .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cuda-unverified-hardware
          path: .build/artifacts/cuda/*
          retention-days: 7
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all
