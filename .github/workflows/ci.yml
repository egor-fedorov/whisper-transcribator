name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff==0.16.9 build==1.6.1 coverage==7.16.1
      - run: ruff check . && ruff format --check whisper_transcribator tests tools
      - run: coverage run -m unittest discover -s tests && coverage report
      - run: bash -n run_whisper.sh transcribe_dir.sh experiments/whisper_cpp/package.sh
      - run: shellcheck run_whisper.sh transcribe_dir.sh experiments/whisper_cpp/package.sh
      - run: python -m build
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7
      - run: pip install dist/*.whl && pip check
      - run: cd /tmp && whisper-transcribator --version && whisper-transcribator doctor --device cpu --json
      - if: matrix.python == '3.13'
        run: python tools/smoke.py --prepare
        env:
          HF_HUB_DISABLE_XET: '1'
      - if: matrix.python == '3.13'
        run: cd /tmp && python "$GITHUB_WORKSPACE/tools/smoke.py" --root "$GITHUB_WORKSPACE/.cache/smoke"
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build --target cpu -t whisper-transcribator:test .
      - run: docker run --rm whisper-transcribator:test doctor --device cpu --json
      - run: docker run --rm -e HF_HUB_DISABLE_XET=1 -v "$PWD/tools:/tools:ro" -v smoke:/smoke --entrypoint python whisper-transcribator:test /tools/smoke.py --prepare --root /smoke
      - run: docker run --rm --network none -v "$PWD/tools:/tools:ro" -v smoke:/smoke --entrypoint python whisper-transcribator:test /tools/smoke.py --root /smoke
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: sudo apt-get update && sudo apt-get install -y libavformat-dev libavcodec-dev libswresample-dev
      - run: cmake -S experiments/whisper_cpp -B build/native -DNATIVE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/native -j2
      - run: ctest --test-dir build/native --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
      - run: |
          curl -fsSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/927cfce34f31707e17f2bff35c349632fb9e2c3a/samples/jfk.wav -o /tmp/jfk.wav
          curl -fsSL https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o /tmp/ggml-tiny.bin
          echo '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  /tmp/jfk.wav' | sha256sum -c -
          echo 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  /tmp/ggml-tiny.bin' | sha256sum -c -
          python tools/native_smoke.py build/native/whisper-transcribator-native /tmp/jfk.wav /tmp/ggml-tiny.bin
        env:
          ASAN_OPTIONS: detect_leaks=1
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all
