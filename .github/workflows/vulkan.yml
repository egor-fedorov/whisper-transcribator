name: Experimental Vulkan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vulkan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: vulkan (linux, model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libvulkan-dev ffmpeg libavformat-dev libavcodec-dev libswresample-dev libcurl4-openssl-dev libssl-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/vulkan-sdk-cache
          key: vulkan-sdk-linux-${{ hashFiles('packaging/vulkan-sdk.json') }}
      - shell: pwsh
        run: ./packaging/vulkan-sdk.ps1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/ccache
          key: vulkan-ccache-linux-${{ hashFiles('cmake/dependencies.cmake', 'packaging/vulkan-sdk.json') }}-${{ github.sha }}
          restore-keys: vulkan-ccache-linux-${{ hashFiles('cmake/dependencies.cmake', 'packaging/vulkan-sdk.json') }}-
      - run: cmake --preset vulkan -DWT_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset vulkan -j2
        env:
          CCACHE_DIR: ${{ github.workspace }}/.build/ccache
          CCACHE_MAXSIZE: 500M
      - run: ctest --preset vulkan
      - name: Verify GPU plugin was built, without requiring a GPU
        run: test -f .build/vulkan/bin/libggml-vulkan.so
      - shell: pwsh
        run: ./tests/integration/inference/vulkan-unavailable.ps1 -Binary .build/vulkan/whisper-transcribator
  windows:
    name: vulkan (windows, model-free)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.build/vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - id: pins
        shell: pwsh
        run: |
          "vcpkg=$((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT
          "compiler=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.pins.outputs.vcpkg }}
          path: .build/vcpkg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/vulkan-sdk-cache
          key: vulkan-sdk-windows-${{ hashFiles('packaging/vulkan-sdk.json') }}
      - shell: pwsh
        run: ./packaging/vulkan-sdk.ps1
      - id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils mingw-w64-x86_64-pkgconf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/windows-ffmpeg
          key: ffmpeg-windows-x64-${{ steps.pins.outputs.compiler }}-${{ hashFiles('packaging/ffmpeg.sh', 'packaging/windows-ffmpeg.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/vcpkg-cache
          key: vcpkg-windows-x64-${{ steps.pins.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}
      - shell: msys2 {0}
        run: bash packaging/windows-ffmpeg.sh
      - shell: pwsh
        run: ./packaging/windows-build.ps1 -Vulkan -Build .build/windows-vulkan -PkgConfig '${{ steps.msys.outputs.msys2-location }}/mingw64/bin/pkgconf.exe'
      - name: Verify GPU plugin was built, without requiring a GPU
        shell: pwsh
        run: |
          if (!(Test-Path .build/windows-vulkan/bin/ggml-vulkan.dll)) { throw 'Vulkan plugin missing' }
      - shell: pwsh
        run: ./tests/integration/inference/vulkan-unavailable.ps1 -Binary .build/windows-vulkan/bin/whisper-transcribator.exe
