[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcribator"
version = "0.2.0"
description = "Docker-friendly CLI for transcribing media files via faster-whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "build==1.6.1", "coverage==7.16.1"]

[project.scripts]
whisper-transcribator = "whisper_transcribator.cli:main"

[tool.setuptools]
packages = ["whisper_transcribator"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["whisper_transcribator"]

[tool.coverage.report]
show_missing = true
fail_under = 80
